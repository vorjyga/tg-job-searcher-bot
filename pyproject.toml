[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tg-jobs-searcher"
version = "0.1.0"
description = "Personal Telegram group keyword monitor"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "aiogram>=3.24,<4",
  "asyncpg>=0.30,<1",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "Telethon>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
tg-jobs-searcher = "tg_jobs_searcher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_jobs_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
